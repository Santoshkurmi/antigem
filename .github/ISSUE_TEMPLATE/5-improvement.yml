name: ✨ Improve an existing feature
description: Something that already exists in AntiGem could work better (UI, speed, a missing option).
title: "[Improvement]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        This is for features that **already exist in AntiGem** and that **you use**.
        Want something completely new (a new agent, provider, MCP, tool, model or big feature)? Use **🧩 New feature / integration** instead.

  - type: checkboxes
    id: checks
    attributes:
      label: Before you start
      options:
        - label: I searched the [existing issues](https://github.com/Santoshkurmi/antigem/issues?q=is%3Aissue) and this has not been asked yet.
          required: true
        - label: I use this feature of AntiGem myself, regularly.
          required: true

  - type: input
    id: feature
    attributes:
      label: Which feature?
      placeholder: "Code editor find and replace"
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: What is the problem today?
      description: What annoys you or slows you down when you use it? A real situation, not a theory.
      placeholder: "When I search in a 3,000-line file, I can't use regex, so I have to open the terminal and use grep."
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: What should change?
      description: Describe the result you want. Screenshots or a quick sketch from another app help.
    validations:
      required: true

  - type: textarea
    id: example
    attributes:
      label: Where have you seen this done well?
      description: An app or tool you use that does it, and how.
      placeholder: "VS Code: the .* toggle in the find box."

  - type: input
    id: app_version
    attributes:
      label: App version
      placeholder: "1.2.0 (129)"
    validations:
      required: true

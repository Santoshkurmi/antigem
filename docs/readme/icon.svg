<svg xmlns="http://www.w3.org/2000/svg" viewBox="18 18 72 72" width="512" height="512">
  <!-- AntiGem "Prism" launcher icon, converted from app/src/main/res/drawable/ic_launcher_{background,foreground}.xml -->
  <defs>
    <clipPath id="shape"><rect x="18" y="18" width="72" height="72" rx="16" ry="16"/></clipPath>
    <radialGradient id="bg" gradientUnits="userSpaceOnUse" cx="54" cy="30" r="80">
      <stop offset="0" stop-color="#252832"/><stop offset="1" stop-color="#07080B"/>
    </radialGradient>
    <radialGradient id="glow">
      <stop offset="0" stop-color="#9FD8FF" stop-opacity="0.5"/><stop offset="1" stop-color="#9FD8FF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="crownShine" gradientUnits="userSpaceOnUse" x1="0" y1="33" x2="0" y2="42">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.18"/><stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="crownLight" gradientUnits="userSpaceOnUse" x1="0" y1="38" x2="0" y2="45">
      <stop offset="0" stop-color="#9FD8FF" stop-opacity="0"/><stop offset="1" stop-color="#9FD8FF" stop-opacity="0.38"/>
    </linearGradient>
    <linearGradient id="pavShade" gradientUnits="userSpaceOnUse" x1="0" y1="50" x2="0" y2="75">
      <stop offset="0" stop-color="#000000" stop-opacity="0"/><stop offset="1" stop-color="#000000" stop-opacity="0.28"/>
    </linearGradient>

      <stop offset="0" stop-color="#5EE7FF" stop-opacity="0"/>
      <stop offset="0.2" stop-color="#5EE7FF"/>
      <stop offset="0.4" stop-color="#FFFFFF"/>
      <stop offset="0.6" stop-color="#C79BFF"/>
      <stop offset="0.8" stop-color="#FFB86B"/>
      <stop offset="1" stop-color="#FFB86B" stop-opacity="0"/>

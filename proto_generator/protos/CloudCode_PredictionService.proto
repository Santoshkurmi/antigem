syntax = "proto3";

package google.internal.cloud.code.v1internal.prediction;

// ========================================================================
// Service: PredictionService (6 Methods)
// Package: google.internal.cloud.code.v1internal.prediction
// Default Upstream Host: https://daily-cloudcode-pa.googleapis.com
// Target Route: /google.internal.cloud.code.v1internal.prediction.PredictionService/<Method>
// ========================================================================

service PredictionService {
  rpc GenerateContent (GenerateContentRequest) returns (GenerateContentResponse);
  rpc StreamGenerateContent (GenerateContentRequest) returns (stream GenerateContentResponse);
  rpc CountTokens (CountTokensRequest) returns (CountTokensResponse);
  rpc RetrieveUserQuota (RetrieveUserQuotaRequest) returns (RetrieveUserQuotaResponse);
  rpc FetchAvailableModels (FetchAvailableModelsRequest) returns (FetchAvailableModelsResponse);
  rpc RetrieveUserQuotaSummary (RetrieveUserQuotaSummaryRequest) returns (RetrieveUserQuotaSummaryResponse);
}


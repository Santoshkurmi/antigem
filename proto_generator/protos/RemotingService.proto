syntax = "proto3";

package exa.remoting;

// ========================================================================
// Service: RemotingService (7 Methods)
// Package: exa.remoting
// Default Upstream Host: http://127.0.0.1 (Local Remoting)
// Target Route: /exa.remoting.RemotingService/<Method>
// ========================================================================

service RemotingService {
  rpc ConnectRemote (ConnectRemoteRequest) returns (stream ConnectRemoteResponse);
  rpc RespondToPrompt (RespondToPromptRequest) returns (RespondToPromptResponse);
  rpc DisconnectRemote (DisconnectRemoteRequest) returns (DisconnectRemoteResponse);
  rpc SaveRemote (SaveRemoteRequest) returns (SaveRemoteResponse);
  rpc DeleteRemote (DeleteRemoteRequest) returns (DeleteRemoteResponse);
  rpc ListRemotes (ListRemotesRequest) returns (ListRemotesResponse);
  rpc ListConnectedRemotes (ListConnectedRemotesRequest) returns (ListConnectedRemotesResponse);
}

// ========================================================================
// Messages & Structs
// ========================================================================

// origin: .google.protobuf.Any
message Any {
  string type_url = 1;
  bytes value = 2;
}

// origin: .exa.remoting.ConnectRemoteRequest
message ConnectRemoteRequest {
  string remote_multi_hop = 1;
}

// origin: .exa.remoting.ConnectRemoteResponse
message ConnectRemoteResponse {
  RemoteConnectionPrompt prompt = 1;
  Status status = 2;
  string remote_id = 3;
}

// origin: .exa.remoting.DeleteRemoteRequest
message DeleteRemoteRequest {
  string remote_id = 1;
}

// origin: .exa.remoting.DeleteRemoteResponse
message DeleteRemoteResponse {
}

// origin: .exa.remoting.DisconnectRemoteRequest
message DisconnectRemoteRequest {
  string remote_id = 1;
}

// origin: .exa.remoting.DisconnectRemoteResponse
message DisconnectRemoteResponse {
}

// origin: .exa.remoting.ListConnectedRemotesRequest
message ListConnectedRemotesRequest {
}

// origin: .exa.remoting.ListConnectedRemotesResponse
message ListConnectedRemotesResponse {
  map<string, RemoteDescriptor> remotes = 1;
}

// origin: .exa.remoting.ListRemotesRequest
message ListRemotesRequest {
  bool include_autodetected = 1;
  bool include_saved = 2;
}

// origin: .exa.remoting.ListRemotesResponse
message ListRemotesResponse {
  repeated RemoteDescriptor remotes = 1;
}

// origin: .exa.remoting.RemoteConnectionPrompt
message RemoteConnectionPrompt {
  string message = 1;
  bool is_secret = 2;
}

// origin: .exa.remoting.RemoteDescriptor
message RemoteDescriptor {
  string remote_multi_hop = 1;
  string name = 2;
  string description = 3;
  string type = 4;
}

// origin: .exa.remoting.RespondToPromptRequest
message RespondToPromptRequest {
  string remote_id = 1;
  string response = 2;
}

// origin: .exa.remoting.RespondToPromptResponse
message RespondToPromptResponse {
}

// origin: .exa.remoting.SaveRemoteRequest
message SaveRemoteRequest {
  RemoteDescriptor descriptor = 1;
}

// origin: .exa.remoting.SaveRemoteResponse
message SaveRemoteResponse {
}

// origin: .google.rpc.Status
message Status {
  int32 code = 1;
  string message = 2;
  repeated Any details = 3;
}

